<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Step-by-step troubleshooting guidance from TechFix Hub.">
  <title>Guide details | TechFix Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg site-nav"><div class="container"><a class="navbar-brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-screwdriver-wrench"></i></span> TechFix <span>Hub</span></a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><ul class="navbar-nav ms-auto align-items-lg-center"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="guides.html">Guides</a></li><li class="nav-item"><a class="nav-link" href="quiz.html">Quiz</a></li><li class="nav-item"><a class="nav-link" href="bookmarks.html">Bookmarks <span class="bookmark-count" aria-label="Saved guide count">0</span></a></li><li class="nav-item"><a class="nav-link" href="about.html">About</a></li></ul></div></div></nav>
  <main class="section-pad"><div class="container">
    <a class="back-link" href="guides.html"><i class="fa-solid fa-arrow-left"></i> All guides</a>
    <div id="detail-content"></div>
    <div class="empty-state d-none" id="detail-error"><span class="empty-icon"><i class="fa-solid fa-circle-exclamation"></i></span><h1>Guide not found</h1><p>This guide may have moved, or the link may be incomplete.</p><a class="btn btn-primary" href="guides.html">Browse all guides</a></div>
  </div></main>
  <footer class="site-footer"><div class="container footer-inner"><a class="navbar-brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-screwdriver-wrench"></i></span> TechFix <span>Hub</span></a><p>Helpful tech guidance, one fix at a time.</p><div class="footer-links"><a href="guides.html">Guides</a><a href="quiz.html">Quiz</a><a href="about.html">About</a></div><small>© <span data-current-year></span> TechFix Hub. For educational purposes.</small></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="assets/js/guides-data.js"></script><script src="assets/js/main.js"></script>
  <script>
    const guide = GUIDES_DATA.find((item) => String(item.id) === new URLSearchParams(location.search).get("id"));
    const detailRoot = document.getElementById("detail-content");
    if (!guide) {
      document.getElementById("detail-error").classList.remove("d-none");
    } else {
      document.title = `${guide.title} | TechFix Hub`;
      detailRoot.innerHTML = `
        <header class="detail-header"><div><div class="badge-row"><span class="category-badge">${escapeHTML(guide.category)}</span><span class="difficulty-badge ${guide.difficulty.toLowerCase()}">${escapeHTML(guide.difficulty)}</span></div><h1>${escapeHTML(guide.title)}</h1><p>${escapeHTML(guide.summary)}</p></div><button id="detail-bookmark" class="btn btn-outline-light bookmark-action" type="button" aria-pressed="false"><i class="fa-regular fa-bookmark"></i> <span>Bookmark guide</span></button></header>
        <div class="detail-layout"><article class="detail-main">
          <section class="detail-section"><h2><span class="section-icon"><i class="fa-solid fa-stethoscope"></i></span> Symptoms</h2><ul class="check-list">${guide.symptoms.map((item) => `<li>${escapeHTML(item)}</li>`).join("")}</ul></section>
          <section class="detail-section"><h2><span class="section-icon"><i class="fa-solid fa-magnifying-glass-chart"></i></span> Possible causes</h2><ul class="check-list">${guide.causes.map((item) => `<li>${escapeHTML(item)}</li>`).join("")}</ul></section>
          <section class="detail-section"><h2><span class="section-icon"><i class="fa-solid fa-list-ol"></i></span> Step-by-step instructions</h2><ol class="step-list">${guide.steps.map((item) => `<li>${escapeHTML(item)}</li>`).join("")}</ol></section>
        </article><aside class="warning-card"><h2><i class="fa-solid fa-triangle-exclamation"></i> Safety first</h2><ul>${guide.warnings.map((item) => `<li>${escapeHTML(item)}</li>`).join("")}</ul><p class="small-muted">Stop if you are unsure. A certified technician can help with complex repairs.</p></aside></div>`;
      const bookmarkButton = document.getElementById("detail-bookmark");
      const refreshButton = () => {
        const saved = isGuideBookmarked(guide.id);
        bookmarkButton.setAttribute("aria-pressed", String(saved));
        bookmarkButton.innerHTML = `<i class="fa-${saved ? "solid" : "regular"} fa-bookmark"></i> <span>${saved ? "Bookmarked" : "Bookmark guide"}</span>`;
      };
      refreshButton();
      bookmarkButton.addEventListener("click", () => { toggleGuideBookmark(guide.id); refreshButton(); });
    }
  </script>
</body>
</html>
